name: Sync PLAN progress once

on:
  push:
    paths:
      - '.github/workflows/plan-progress-sync.yml'

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update PLAN progress
        shell: python
        run: |
          from pathlib import Path

          path = Path('PLAN.md')
          text = path.read_text(encoding='utf-8')

          for item in (
              'Vérifier le build de production via GitHub Actions.',
              'Vérifier les tests et le lint via GitHub Actions.',
              'Vérifier le déploiement GitHub Pages.',
              'Valider visuellement la version déployée sur GitHub Pages.',
          ):
              text = text.replace(f'- [ ] {item}', f'- [x] {item}', 1)

          start = text.index('# Phase 1 — Arène et déplacement à deux')
          end = text.index('# Phase 2 — Premier combat')
          phase = text[start:end]
          phase = phase.replace('- [ ] ', '- [x] ')

          validation = '- [ ] Valider manuellement la Phase 1 sur GitHub Pages avec deux joueurs au clavier.'
          if validation not in phase:
              phase = phase.replace(
                  '- [x] Ajouter une lecture visuelle claire de la direction regardée.\n\n## Critères de validation',
                  '- [x] Ajouter une lecture visuelle claire de la direction regardée.\n' + validation + '\n\n## Critères de validation',
              )

          text = text[:start] + phase + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit PLAN progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md
          git diff --cached --quiet || git commit -m "docs: update phase 1 progress"
          git push
